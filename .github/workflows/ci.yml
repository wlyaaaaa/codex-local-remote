name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan repository for public-safety violations
        run: pnpm check:public
      - name: Run checks outside the Windows short-path user temp
        run: |
          $testTemp = (Get-Item -LiteralPath $env:RUNNER_TEMP -Force).FullName
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          pnpm check
      - name: Install Chromium for browser acceptance
        run: pnpm exec playwright install chromium
      - name: Run responsive browser acceptance
        run: pnpm test:e2e
